name: Cross-Platform Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build trên ${{ matrix.os-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os-name: macOS (Apple Silicon ARM64)
            artifact_name: afk-journey-bot-macos-arm64
            release_asset: afk-journey-bot-macos-arm64.zip
            add_data_sep: ":"
          - os: windows-latest
            os-name: Windows (x64)
            artifact_name: afk-journey-bot-windows-x64
            release_asset: afk-journey-bot-windows-x64.zip
            add_data_sep: ";"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cài đặt thư viện phụ thuộc & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Chạy unit tests
        run: python -m unittest discover -s tests -v

      - name: Tạo metadata phiên bản build
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            PKG_VERSION=$(grep '^APP_VERSION' config.py | head -n1 | cut -d '"' -f2)
            TAG_NAME="v${PKG_VERSION}-build.${{ github.run_number }}"
          fi
          python -c "import json; json.dump({'tag': '${TAG_NAME}', 'sha': '${{ github.sha }}', 'run_number': int('${{ github.run_number }}')}, open('build_info.json', 'w'), indent=2)"

      - name: Đóng gói ứng dụng bằng PyInstaller
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed \
            --name "AFKJourneyBot" \
            --collect-all rapidocr_onnxruntime \
            --collect-all customtkinter \
            --collect-data certifi \
            --add-data "build_info.json${{ matrix.add_data_sep }}." \
            ${{ matrix.os == 'macos-latest' && '--osx-bundle-identifier com.afkjourneybot.app' || '' }} \
            main.py

      # Ký .app bằng chứng chỉ tự tạo cố định (không cần Apple Developer) để macOS giữ quyền
      # Trợ năng qua các lần update. Thiếu secret thì bỏ qua, build vẫn chạy như cũ.
      - name: Ký ứng dụng bằng chứng chỉ cố định (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::warning::Chưa có secret MACOS_CERT_P12 — app không được ký, macOS sẽ đòi cấp lại quyền Trợ năng sau mỗi lần update."
            exit 0
          fi
          KC="$RUNNER_TEMP/afk-signing.keychain-db"
          KC_PASS="$(uuidgen)"
          P12="$RUNNER_TEMP/afk-signing.p12"
          # Bỏ xuống dòng / CR thừa khi dán secret
          CERT_PASS="$(printf '%s' "$MACOS_CERT_PASSWORD" | tr -d '\r\n')"
          trap 'rm -f "$P12"; security delete-keychain "$KC" 2>/dev/null || true' EXIT

          echo "==> Giải mã MACOS_CERT_P12"
          if ! printf '%s' "$MACOS_CERT_P12" | tr -d '[:space:]' | base64 --decode > "$P12" || [ ! -s "$P12" ]; then
            echo "::error::MACOS_CERT_P12 không phải base64 hợp lệ. Tạo lại bằng: base64 -i file.p12 | pbcopy"
            exit 1
          fi
          echo "    .p12 = $(wc -c < "$P12" | tr -d ' ') bytes"

          echo "==> Tạo keychain tạm"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"

          echo "==> Import .p12"
          if ! IMPORT_OUT=$(security import "$P12" -k "$KC" -P "$CERT_PASS" -T /usr/bin/codesign 2>&1); then
            echo "$IMPORT_OUT"
            echo "::error::Import .p12 thất bại: $IMPORT_OUT — kiểm tra MACOS_CERT_PASSWORD đúng mật khẩu file .p12 (không thừa dấu cách)."
            exit 1
          fi
          echo "$IMPORT_OUT"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null 2>&1 || true

          echo "==> Tìm chứng chỉ ký code"
          IDS=$(security find-identity -p codesigning "$KC")
          echo "$IDS"
          IDENTITY=$(echo "$IDS" | awk '/^ *1\)/{print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "Chứng chỉ có trong .p12:"; security find-certificate -a "$KC" | grep -E '"labl"|"alis"' || true
            echo "::error::Không có identity ký code trong .p12 — thiếu private key, hoặc chứng chỉ không phải loại Code Signing."
            exit 1
          fi

          echo "==> Ký app"
          codesign --force --deep --keychain "$KC" -s "$IDENTITY" dist/AFKJourneyBot.app
          codesign --verify --deep --strict dist/AFKJourneyBot.app
          REQ=$(codesign -dr - dist/AFKJourneyBot.app 2>&1)
          echo "$REQ"
          echo "$REQ" | grep -q 'certificate leaf' || { echo "::error::Chữ ký không gắn với chứng chỉ"; exit 1; }

      - name: Nén file phát hành (macOS .app)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/AFKJourneyBot.app "dist/${{ matrix.release_asset }}"

      - name: Nén file phát hành (Windows .exe)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/AFKJourneyBot" -DestinationPath "dist/${{ matrix.release_asset }}" -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.release_asset }}
          if-no-files-found: error

  publish-release:
    name: Tự động phát hành GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra mã nguồn để đọc phiên bản
        uses: actions/checkout@v4

      - name: Tải toàn bộ artifacts đã build
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Xác định tag và tiêu đề Release
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            PKG_VERSION=$(grep '^APP_VERSION' config.py | head -n1 | cut -d '"' -f2)
            TAG_NAME="v${PKG_VERSION}-build.${{ github.run_number }}"
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "title=Release ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Xuất bản Release chính thức trên GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_meta.outputs.title }}
          prerelease: false
          generate_release_notes: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
